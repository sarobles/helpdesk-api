spring.application.name=helpdesk-api

# --- Base de datos: H2 en memoria ---
spring.datasource.url=jdbc:h2:mem:helpdeskdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Consola web de H2 (solo para desarrollo) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
# update: crea/actualiza tablas segun las entidades. Solo apto para desarrollo.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Puerto del servidor (opcional, 8080 es el valor por defecto) ---
server.port=8080