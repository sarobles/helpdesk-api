spring.application.name=helpdesk-api

# --- Base de datos: H2 en memoria ---
spring.datasource.url=jdbc:h2:mem:helpdeskdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Consola web de H2 (solo para desarrollo) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Puerto del servidor ---
server.port=8080

# --- JWT ---
# Clave secreta usada para firmar y validar tokens. En un proyecto real
# NUNCA se deja escrita asi en el codigo/properties versionado en Git;
# para este taller academico es suficiente.
jwt.secret=una-clave-secreta-larga-y-dificil-de-adivinar-cambiala-siempre-1234567890
# 15 minutos en milisegundos (Access Token)
jwt.access-token-expiration-ms=900000
# 7 dias en milisegundos (Refresh Token, lo usamos en el Modulo 8)
jwt.refresh-token-expiration-ms=604800000
